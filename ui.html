<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kant Lean Worker</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        body { font-family: monospace; background: #0a0a0a; color: #00ff00; padding: 20px; }
        h1 { color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        h2 { color: #00ffff; font-size: 1.2em; margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { border: 1px solid #333; padding: 15px; border-radius: 8px; background: #111; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; }
        th { color: #888; }
        button { border: none; padding: 8px 16px; cursor: pointer; font-weight: bold; border-radius: 4px; font-family: monospace; width: 100%; margin-bottom: 10px; }
        .btn-phantom { background: #9933ff; color: white; }
        .btn-solflare { background: #ff9900; color: black; }
        .btn-green { background: #00ff00; color: #000; }
        .btn-cyan { background: #00ffff; color: #000; }
        input { width: 100%; background: #222; color: #00ff00; border: 1px solid #444; padding: 8px; margin-bottom: 10px; font-family: monospace; box-sizing: border-box; }
        .error { color: #ff4444; font-size: 0.8em; word-break: break-all; margin-top: 5px; }
        .success { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🟢 Kant Lean Worker Dashboard</h1>
    
    <div class="grid">
        <!-- Card 1: Wallet Connection -->
        <div class="card">
            <h2>Wallet Connection</h2>
            <p>Address: <span id="walletAddress" style="color: #fff;">Not connected</span></p>
            <p>Real $SOLFUNMEME: <span id="tokenBalance" class="success">0</span></p>
            
            <button onclick="connectWallet('phantom')" class="btn-phantom">Connect Phantom</button>
            <button onclick="connectWallet('solflare')" class="btn-solflare">Connect Solflare</button>
            
            <div id="walletError" class="error"></div>
        </div>

        <!-- Card 2: Node Status -->
        <div class="card">
            <h2>Node Status</h2>
            <p>Status: <span id="status">Loading...</span></p>
            <p>Sections: <span id="count">0</span></p>
            <button onclick="loadData()" class="btn-green">Refresh</button>
        </div>

        <!-- Card 3: Wallet Balances -->
        <div class="card">
            <h2>Service Credits</h2>
            <p>User Credits: <span id="userCredits" class="success">0</span></p>
            <p>Node Credits: <span id="nodeCredits" class="success">0</span></p>
            <button onclick="stakeCredits()" class="btn-green">Stake +50 Credits</button>
            <hr style="border-color: #333; margin: 15px 0;">
            <input type="number" id="withdrawAmount" placeholder="Amount to withdraw" style="margin-bottom: 5px;">
            <button onclick="withdrawCredits()" class="btn-orange" style="background:#ff9900; color:black;">Withdraw to Solana</button>
            <div id="withdrawResult" class="success" style="font-size: 0.8em; margin-top:5px; word-break: break-all;"></div>
        </div>
    </div>

    <div class="grid">
        <!-- Card 4: Submit -->
        <div class="card">
            <h2>Submit New Theory</h2>
            <input type="text" id="theoryName" placeholder="Theory Name (e.g. crank_alpha)">
            <button onclick="submitTheory()" class="btn-green">Hash, Validate & Submit</button>
            <div id="submitResult"></div>
        </div>

        <!-- Card 5: Export -->
        <div class="card">
            <h2>Export Knowledge Base</h2>
            <button onclick="window.open('/api/erdfa/export')" class="btn-cyan">Export JSON</button>
            <button onclick="window.open('/api/erdfa/export/jsonld')" class="btn-cyan">Export JSON-LD</button>
            <button onclick="window.open('/api/erdfa/export/xml')" class="btn-cyan">Export XML</button>
        </div>
    </div>

    <!-- Card 6: Knowledge Base -->
    <div class="card">
        <h2>Knowledge Base (Latest)</h2>
        <table>
            <thead><tr><th>CID</th><th>Shard</th><th>CRT (Gödel)</th><th>Eigenspace</th></tr></thead>
            <tbody id="kbTable"></tbody>
        </table>
    </div>

    <script>
        const MINT_ADDRESS = "BwUTq7fS6sfUmHDwAiCQZ3asSiPEapW5zDrsbwtapump";

        async function connectWallet(type) {
            const errorDiv = document.getElementById('walletError');
            errorDiv.innerText = '';
            
            try {
                let address = null;
                if (type === 'phantom') {
                    if (window.phantom?.solana?.isPhantom) {
                        const resp = await window.phantom.solana.connect();
                        address = resp.publicKey.toString();
                    } else throw new Error("Phantom extension not found.");
                } else if (type === 'solflare') {
                    if (window.solflare) {
                        await window.solflare.connect();
                        address = window.solflare.publicKey.toString();
                    } else throw new Error("Solflare extension not found.");
                }

                document.getElementById('walletAddress').innerText = address;
                fetchTokenBalance(address);
            } catch (err) {
                errorDiv.innerText = err.message;
            }
        }

        async function fetchTokenBalance(address) {
            const balanceSpan = document.getElementById('tokenBalance');
            const errorDiv = document.getElementById('walletError');
            balanceSpan.innerText = "Loading...";
            errorDiv.innerText = "Fetching via local proxy..."; 
            
            try {
                // Trimitem catre proxy-ul nostru local
                const payload = {
                    jsonrpc: "2.0",
                    id: 1,
                    method: "getTokenAccountsByOwner",
                    params: [ address, { mint: MINT_ADDRESS }, { encoding: "jsonParsed" } ]
                };

                const response = await fetch("http://localhost:8081", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();

                if (data.error) throw new Error(data.error.message);

                if (data.result && data.result.value && data.result.value.length > 0) {
                    const balance = data.result.value[0].account.data.parsed.info.tokenAmount.uiAmount;
                    balanceSpan.innerText = balance.toLocaleString('en-US', {maximumFractionDigits: 2});
                    balanceSpan.style.color = "#00ff00";
                    errorDiv.innerText = "Token found!";
                } else {
                    balanceSpan.innerText = "0";
                    balanceSpan.style.color = "#888";
                    errorDiv.innerText = "Tokenul nu a fost găsit în acest portofel.";
                }
            } catch (err) {
                console.error("Error fetching balance:", err);
                balanceSpan.innerText = "Error";
                balanceSpan.style.color = "#ff4444";
                errorDiv.innerText = "Proxy Error: " + err.message;
            }
        }

        async function stakeCredits() {
            await fetch('/api/erdfa/stake/default_user:50', { method: 'POST' });
            loadData();
        }

        async function submitTheory() {
            const name = document.getElementById('theoryName').value.trim();
            if (!name) return alert("Enter a theory name");
            
            const res = document.getElementById('submitResult');
            res.innerHTML = "Hashing & Submitting...";
            
            try {
                const hashRes = await fetch('/api/erdfa/hash/' + encodeURIComponent(name));
                const hashData = await hashRes.json();
                
                const pad = Math.random().toString(16).slice(2, 13).padEnd(11, '0');
                const addr = "0xda510" + pad;
                
                const payload = {
                    "cid": "theory_" + name,
                    "erdfa:shard": hashData["erdfa:shard"],
                    "erdfa:prime": "1",
                    "erdfa:encoding": "raw",
                    "dasl:addr": addr,
                    "dasl:type": "0",
                    "dasl:eigenspace": "Earth",
                    "dasl:bott": "0 (R)",
                    "dasl:hecke": "T_2",
                    "sheaf:orbifold": hashData["sheaf:orbifold"],
                    "sheaf:subgroupIndex": "erdfa:H/raw"
                };
                
                const submitRes = await fetch('/api/erdfa/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const submitData = await submitRes.json();
                
                if (submitRes.ok) {
                    res.innerHTML = `<span class="success">Success: ${submitData.status.toUpperCase()} (CRT: ${submitData.crt})</span>`;
                    document.getElementById('theoryName').value = '';
                    loadData();
                } else {
                    res.innerHTML = `<span class="error">Error: ${submitData.error || submitData.message || "Unknown"}</span>`;
                }
            } catch (e) {
                res.innerHTML = `<span class="error">Network error</span>`;
            }
        }

        async function withdrawCredits() {
            const amount = document.getElementById('withdrawAmount').value;
            const resDiv = document.getElementById('withdrawResult');
            if (!amount || amount <= 0) return alert("Enter a valid amount");
            
            resDiv.innerText = "Processing...";
            resDiv.style.color = "#00ffff";
            
            try {
                const resp = await fetch(`/api/erdfa/withdraw/default_user:${amount}`, { method: 'POST' });
                const data = await resp.json();
                
                if (resp.ok) {
                    resDiv.innerHTML = `✅ Withdrawn! Receipt: <br><span style="font-size:0.8em;">${data.receipt}</span>`;
                    resDiv.style.color = "#00ff00";
                    loadData();
                } else {
                    resDiv.innerHTML = `❌ ${data.error}`;
                    resDiv.style.color = "#ff4444";
                }
            } catch (e) {
                resDiv.innerText = "Network error.";
                resDiv.style.color = "#ff4444";
            }
        }

        async function loadData() {
            try {
                const statusRes = await fetch('/api/erdfa/status');
                const statusData = await statusRes.json();
                document.getElementById('status').innerText = statusData.status;
                document.getElementById('count').innerText = statusData.sections_count;

                const userRes = await fetch('/api/erdfa/wallet/default_user');
                const userData = await userRes.json();
                document.getElementById('userCredits').innerText = userData.credits || 0;

                const nodeRes = await fetch('/api/erdfa/wallet/lean_node_worker');
                const nodeData = await nodeRes.json();
                document.getElementById('nodeCredits').innerText = nodeData.credits || 0;

                const listRes = await fetch('/api/erdfa/export');
                const listData = await listRes.json();
                const tbody = document.getElementById('kbTable');
                tbody.innerHTML = '';
                listData.reverse().slice(0, 15).forEach(s => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${s.cid}</td><td>${s['erdfa:shard']}</td><td>${s['erdfa:crt']}</td><td>${s['dasl:eigenspace']}</td>`;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
            }
        }

        loadData();
    </script>
</body>
</html>
